<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jessé Auto Couros e Capotas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jessé Auto Couros">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{--er:#c62828;--o:#f58220;--bg:#f6f6f5;--cd:#fff;--tx:#1c1c1c;--mu:#6b6b6b;--bd:#e4e4e2;--sh:0 2px 12px rgba(0,0,0,.09);--nh:58px;color-scheme:light}
[data-theme=dark]{--er:#ff7b7b;--bg:#121212;--cd:#1b1b1b;--tx:#f2f2f2;--mu:#a3a3a3;--bd:#2c2c2c;--sh:0 2px 14px rgba(0,0,0,.55);color-scheme:dark}
@font-face{font-family:Inter;font-weight:400;font-display:swap;src:local('Inter Regular'),local('Inter-Regular'),url('fonts/Inter-Regular.woff') format('woff')}
@font-face{font-family:Inter;font-weight:600;font-display:swap;src:local('Inter SemiBold'),local('Inter-SemiBold'),url('fonts/Inter-SemiBold.woff') format('woff')}
@font-face{font-family:Inter;font-weight:700;font-display:swap;src:local('Inter Bold'),local('Inter-Bold'),url('fonts/Inter-Bold.woff') format('woff')}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-bottom:90px}
body{margin:0;font:14.5px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
/* cabeçalho */
header{background:#000;display:flex;align-items:center;gap:10px;padding:5px 14px;padding-top:calc(5px + env(safe-area-inset-top,0px));position:sticky;top:0;z-index:5}
header img{height:34px;border-radius:4px}header b{color:#fff;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* navegação inferior */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--cd);border-top:1px solid var(--bd);box-shadow:var(--sh);padding-bottom:env(safe-area-inset-bottom,0px)}
nav>a,nav>button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--nh);padding:0 2px;color:var(--mu);background:none;border:0;font:inherit;font-size:10.5px;font-weight:600;text-decoration:none;cursor:pointer;position:relative}
nav .ic{width:22px;height:22px}nav span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav .on{color:var(--o)}nav>.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:2px;background:var(--o);border-radius:0 0 2px 2px}
.more{position:absolute;right:8px;bottom:calc(100% + 8px);min-width:200px;background:var(--cd);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh);padding:4px;display:flex;flex-direction:column}
nav .more a{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border-radius:8px;color:var(--tx);text-decoration:none;font-size:14px;font-weight:600}
nav .more a:hover{background:var(--bg)}nav .more a.on{color:var(--o)}nav .more .ic{width:18px;height:18px}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
body.kb nav{display:none}
@media(max-width:359px){nav>a,nav>button{font-size:9.5px;padding:0}}
main{max-width:1080px;margin:0 auto;padding:12px 14px calc(var(--nh) + 30px + env(safe-area-inset-bottom,0px))}
@media(min-width:800px){
nav{left:50%;right:auto;transform:translateX(-50%);bottom:14px;width:min(560px,calc(100% - 32px));border:1px solid var(--bd);border-radius:16px;padding-bottom:0}
nav>a,nav>button{flex-direction:row;gap:8px;height:48px;font-size:13px}nav .ic{width:18px;height:18px}
nav>.on::before{top:auto;bottom:0;left:22%;right:22%;border-radius:2px 2px 0 0}
.more{right:0}main{padding:18px 28px 110px}.toast{bottom:78px!important}}
/* tipografia */
h2{margin:2px 0 10px;font-size:18px;font-weight:700}h3{margin:0 0 8px;font-size:15px}h4{margin:12px 0 6px;font-size:13px;color:var(--mu)}
h2,h3,.card,.stat,.md>div{overflow-wrap:anywhere}.mu{color:var(--mu);font-size:13px}
/* cartões */
.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.k4{grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.k4{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;min-width:0}
.stat b{display:block;font-size:clamp(18px,5.4vw,22px);line-height:1.2}.stat small{display:block;color:var(--mu);font-size:12px;line-height:1.3}
.stat.al b{color:var(--er)}.stat.wn b{color:var(--o)}
.stat[role=button],.wc{cursor:pointer}.stat[role=button]:hover,.wc:hover{border-color:var(--o)}
details.mi{margin:12px 0 4px}details.mi>summary{cursor:pointer;color:var(--mu);font-size:13px;padding:4px 0}details.mi[open]>summary{margin-bottom:8px}
/* botões e campos */
.b{background:var(--o);color:#000;border:0;border-radius:8px;padding:6px 14px;min-height:38px;font-family:inherit;font-weight:600;font-size:13.5px;line-height:1.2;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-align:center;gap:6px;max-width:100%}
.b.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}.b.r{background:#c62828;color:#fff}.b.s{padding:4px 10px;font-size:12.5px;min-height:32px}.b:disabled{opacity:.55;cursor:default}
.badge{background:var(--o);color:#000;border-radius:99px;padding:0 6px;font-size:11px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.row select{max-width:100%}
.bar{display:flex;gap:8px;margin-bottom:10px}.bar input{flex:1;min-width:0}
input,select,textarea{width:100%;min-height:38px;font:inherit;font-size:14.5px;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--cd);color:var(--tx)}
textarea{min-height:60px;resize:vertical}
@media(pointer:coarse){input,select,textarea{min-height:44px;font-size:16px}.b{min-height:44px}.b.s{min-height:38px}}
label{display:block;font-size:12.5px;color:var(--mu);margin:7px 0 2px}
:focus-visible{outline:2px solid var(--o);outline-offset:2px}
input:focus,select:focus,textarea:focus{border-color:var(--o);outline:2px solid color-mix(in srgb,var(--o) 35%,transparent);outline-offset:0}
.inv,.inv:focus{border-color:var(--er)!important;outline-color:color-mix(in srgb,var(--er) 35%,transparent)}
.er{color:var(--er);font-weight:600;margin:6px 0 0}.fe{display:block;color:var(--er);font-size:12.5px;font-weight:600;margin-top:3px;line-height:1.35}.fe:empty{display:none}.fe .b{margin-top:6px}
.rq{color:var(--er);font-weight:700}.op{font-size:11.5px}
/* etiquetas */
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;line-height:1.5;font-weight:600;background:#fde7d1;color:#8a4300;vertical-align:middle}
.tag.v{background:#d9f2df;color:#14612a}.tag.x{background:#fadbd8;color:#8e1b12}.tag.y{background:#fff3c4;color:#7a5b00}.tag.bl{background:#dbe9fb;color:#12408a}.tag.n{background:#e6e6e4;color:#444}
.split{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.split>div:first-child{flex:1;min-width:0}.split>div:last-child{flex:none;max-width:48%}
/* grupos e lista de OS */
.gh{margin:14px 0 6px;font-size:13px;padding-left:8px;border-left:3px solid var(--o)}h4.gh{margin:10px 0 6px;color:var(--tx)}
.gh.x{border-color:#c62828;color:var(--er)}.gh.bl{border-color:#1f6fd1}.gh.n{border-color:#888}.gh.v{border-color:#2e8b4d}
.wc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 12px;margin-bottom:6px}
.wc.late{border-left:3px solid #c62828}.wc.soon{border-left:3px solid var(--o)}
.w1{grid-column:1;grid-row:1}.w5{grid-column:2;grid-row:1;justify-self:end}
.w2{grid-column:1/-1;grid-row:2;color:var(--mu);font-size:13px}.w6{grid-column:1/-1;grid-row:3;color:var(--mu);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w3{grid-column:1;grid-row:4;font-size:13px}.w4{grid-column:2;grid-row:4;font-size:13px;justify-self:end;text-align:right;white-space:nowrap}
.wc.mini .w6{display:none}.wc.mini .w3,.wc.mini .w4{grid-row:3}
@media(min-width:900px){.wc{grid-template-columns:minmax(0,1.6fr) minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.1fr) auto;grid-template-rows:auto auto;align-items:center;column-gap:16px}
.w1{grid-column:1;grid-row:1}.w2{grid-column:1;grid-row:2}.w6{grid-column:2;grid-row:1/3;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.w3{grid-column:3;grid-row:1/3}.w4{grid-column:4;grid-row:1/3;justify-self:start;text-align:left}.w5{grid-column:5;grid-row:1/3}
.wc.mini .w3,.wc.mini .w4{grid-row:1/3}}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:0 10px}.meta{margin:-2px 0 8px;min-height:0}
.kan{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}.kan>div{min-width:220px;flex:1}
.kv{display:grid;grid-template-columns:minmax(96px,34%) 1fr;gap:6px 12px;margin:8px 0}.kv dt{color:var(--mu);font-size:12.5px}.kv dd{margin:0}
.hist{list-style:none;margin:0;padding:0}.hist li{border-left:3px solid var(--o);padding:2px 0 8px 10px}
/* modais e formulários */
.md{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.md>div{background:var(--cd);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:14px 14px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:var(--sh)}
@media(min-width:800px){.md{align-items:center}.md>div{border-radius:14px}}
#f{display:grid;grid-template-columns:1fr;gap:0 12px}#f>.er,#f>.row{grid-column:1/-1}.fld{min-width:0}
@media(min-width:520px){#f{grid-template-columns:1fr 1fr}.fld.full{grid-column:1/-1}}
.it{display:grid;grid-template-columns:3fr 1fr 1.4fr auto;gap:6px;margin-bottom:6px}.it .d,.it .q,.it .v{min-width:0}
@media(max-width:480px){.it{grid-template-columns:1fr 1.4fr auto;padding-bottom:8px;margin-bottom:8px;border-bottom:1px dashed var(--bd)}.it .d{grid-column:1/-1}.doc{font-size:13px;padding:10px}.doc td,.doc th{padding:5px 3px}}
.doc{background:#fff;color:#000;padding:14px;border-radius:8px;overflow-x:auto}.doc img{height:60px}.doc table{width:100%;border-collapse:collapse;margin:10px 0}
.doc td,.doc th{border-bottom:1px solid #ccc;padding:6px;text-align:left;overflow-wrap:anywhere}.doc .t{text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nh) + 16px + env(safe-area-inset-bottom,0px));background:#111;color:#fff;border:1px solid var(--o);padding:9px 14px;border-radius:10px;z-index:30;max-width:90vw;font-size:13.5px}
@media print{body *{visibility:hidden}.doc,.doc *{visibility:visible}.doc{position:absolute;left:0;top:0;width:100%}}
.fld.off{display:none}
.cr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 12px;margin-bottom:6px;cursor:pointer}.cr:hover{border-color:var(--o)}
.c1{grid-column:1;grid-row:1}.c5{grid-column:2;grid-row:1;justify-self:end}.c2{grid-column:1;grid-row:2;color:var(--mu);font-size:13px}.c4{grid-column:2;grid-row:2;justify-self:end}.c3{grid-column:1/-1;grid-row:3;color:var(--mu);font-size:12.5px}
@media(min-width:900px){.cr{grid-template-columns:minmax(0,1.8fr) minmax(0,1.7fr) auto 130px;align-items:center;column-gap:16px}.c1{grid-column:1;grid-row:1}.c2{grid-column:1;grid-row:2}.c3{grid-column:2;grid-row:1/3}.c5{grid-column:3;grid-row:1/3}.c4{grid-column:4;grid-row:1/3;justify-self:end}}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}.seg button{background:none;border:0;border-right:1px solid var(--bd);padding:6px 12px;font:inherit;font-size:13px;font-weight:600;color:var(--mu);cursor:pointer;min-height:34px}.seg button:last-child{border-right:0}.seg button.on{background:var(--o);color:#000}
.li{margin:0 0 8px;padding-left:20px}
.wc.canc{opacity:.7}
details.fin>summary{cursor:pointer;margin:14px 0 6px}details.fin>summary::marker{color:var(--mu)}
</style>

<body>
<header><img src="icons/logo.jpg" alt="Jessé Auto Couros e Capotas"><b>Jessé Auto Couros</b></header>
<nav id="nav" aria-label="Navegação principal"></nav>
<main id="app"></main>
<script src="utils.js"></script>
<script>
/* ===== Dados (camada única: trocar load/save por chamadas à API Cloudflare no futuro) ===== */
const KEY='jesse_v1',$=s=>document.querySelector(s);
const ST={q:['Aprovado','Recusado'],
o:['Em produção','Finalizado','Entregue'],
s:['Em produção','Finalizado','Entregue']};
const SERV=['Revestimento de bancos em couro','Reforma de bancos','Revestimento de volante','Forração de portas','Forração de teto','Confecção de capota marítima','Reforma de capota','Revestimento de painel'];
const V=(marca,modelo,ano,placa)=>({marca,modelo,ano,placa});
function ld(off){const d=new Date();if(off)d.setDate(d.getDate()+off);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function seed(){
 const c=[['Carlos Menezes','(67) 99812-3344','529.982.247-25','Rua das Flores, 120'],['Ana Beatriz Souza','(67) 99123-4567','','Av. Afonso Pena, 800'],['Marcos Vinícius Lima','(67) 98456-1122','','Rua Bahia, 45'],['Náutica Pantanal Ltda','(67) 99321-9988','11.222.333/0001-81','Av. Gury Marques, 2000'],['Fernanda Ribeiro','(67) 99700-8899','','Rua Pedro Celestino, 310']].map((x,i)=>({id:'c'+(i+1),nome:x[0],tel:x[1],doc:x[2],end:x[3],obs:''}));
 const e=(d,q,v)=>({d,q,v});
 const q=[
 ['c1',V('Toyota','Hilux','2019','QWE1A23'),[e(SERV[0],1,4800),e(SERV[2],1,450)],200,'Aprovado','2026-10-20'],
 ['c2',V('Honda','Civic','2016','ABC1D34'),[e(SERV[1],1,1800),e(SERV[4],1,900)],0,'Aprovado','2026-10-25'],
 ['c3',V('Jeep','Wrangler','2014','FGH2E45'),[e(SERV[5],1,3500)],150,'Aprovado','2026-11-02'],
 ['c4',V('Chevrolet','S10','2021','JKL3F56'),[e(SERV[3],4,250),e(SERV[7],1,1200)],0,'Aprovado','2026-11-05'],
 ['c5',V('Fiat','Toro','2020','MNO4G67'),[e(SERV[0],1,4200)],0,'Aguardando aprovação','2026-11-09'],
 ['c1',V('Ford','Ka','2017','PQR5H78'),[e(SERV[6],1,1300)],0,'Rascunho','2026-11-11']
 ].map((x,i)=>({id:'q'+(i+1),n:i+1,c:x[0],v:x[1],items:x[2],disc:x[3],status:x[4],date:x[5],obs:''}));
 const o=[['q1','Em produção',1500,'PIX','2026-11-20'],['q2','Pedido recebido',500,'Cartão','2026-11-28'],['q3','Aguardando execução',1000,'PIX','2026-12-05'],['q4','Finalizado',0,'Dinheiro','2026-11-10']].map((x,i)=>({id:'o'+(i+1),n:i+1,q:x[0],status:x[1],entry:x[2],pay:x[3],due:x[4],obs:''}));
 const s=[['Jessé Costa','(67) 99999-1111','Couro e bancos'],['Pedro Alves','','Capotas'],['Luiz Henrique','(67) 99888-2222','Forração e painéis']].map((x,i)=>({id:'s'+(i+1),nome:x[0],tel:x[1],esp:x[2],obs:'',ativo:true}));
 const os=[['o1','s1','Em produção',-8,-1],['o1','s3','Em produção',0,2],['o2','s3','Em produção',0,14],['o3','s2','Finalizado',-2,21],['o4','s1','Entregue',-10,-3]].map((x,i)=>({id:'w'+(i+1),n:i+1,o:x[0],s:x[1],status:x[2],date:ld(x[3]),due:ld(x[4]),delivered:x[2]=='Entregue'?ld(-3):'',desc:'Executar conforme orçamento.',obs:'',hist:[{at:new Date().toISOString(),kind:'status',from:'',to:x[2],by:'Administração',note:'Registro demonstrativo'}]}));
 const d={c,q,o,s,w:os};d.q[4].status='';d.q[5].status='Recusado';d.q.forEach(x=>{if(d.o.some(y=>y.q==x.id))x.conv=true});d.o.forEach(y=>{if(y.status=='Pedido recebido'||y.status=='Aguardando execução')y.status='Em produção'});migrate(d);delete d.mig;delete d.migs;return d;
}
/* Migração 1.2: cada pedido guarda cópia independente dos dados do orçamento. Segura para rodar várias vezes. */
function migrate(d){let n=0;d.o.forEach(o=>{if(Array.isArray(o.items))return;const q=d.q.find(x=>x.id==o.q);if(!q)return;const c=d.c.find(x=>x.id==q.c);o.c=q.c;o.cnome=c?c.nome:'';o.ctel=c?c.tel:'';o.v={...q.v};o.items=q.items.map(i=>({...i}));o.disc=q.disc||0;o.qn=q.n;n++});
 /* só padroniza o formato de valores VÁLIDOS; valores inválidos antigos ficam como estão */
 d.c.forEach(c=>{if(c.tel&&JU.validPhone(c.tel))c.tel=JU.fmtPhone(c.tel);if(c.doc&&JU.validDoc(c.doc))c.doc=JU.fmtDoc(c.doc)});d.s.forEach(s=>{if(s.tel&&JU.validPhone(s.tel))s.tel=JU.fmtPhone(s.tel)});
 [...d.q,...d.o].forEach(x=>{if(x.v&&x.v.placa&&JU.validPlate(x.v.placa))x.v.placa=JU.fmtPlate(x.v.placa);if(x.ctel&&JU.validPhone(x.ctel))x.ctel=JU.fmtPhone(x.ctel)});
 /* v1.4: status novos + histórico das OS. Só preenche o que falta (idempotente); nunca apaga. */
 const LEG={'Concluída':'Pronto para entrega','Pausada':'Em execução'};let nw=0,mp=0;
 d.w.forEach(w=>{if(!w.date&&w.start)w.date=w.start;if(Array.isArray(w.hist))return;const old=w.status;if(LEG[old]){w.status=LEG[old];mp++}
  w.hist=[{at:new Date().toISOString(),kind:'status',from:'',to:w.status,by:'Administração',note:'Histórico iniciado na versão 1.4'+(LEG[old]?'. Status anterior: '+old:'')}];nw++});
 if(nw)d.migw={n:nw,mapped:mp,at:new Date().toLocaleDateString('pt-BR')};
 /* v1.5.1: status simplificados + orçamentos já convertidos. Só converte valores antigos (o original fica em st0); nunca apaga nem cria pedidos. */
 const LQ={'Rascunho':'','Aguardando aprovação':'','Cancelado':'Recusado'},LO={'Pedido recebido':'Em produção','Aguardando execução':'Em produção'};let nq=0,no=0,nc=0;
 d.q.forEach(q=>{if(LQ[q.status]!==undefined){q.st0=q.st0||q.status;q.status=LQ[q.status];nq++}if(!q.conv&&d.o.some(o=>o.q==q.id)){q.conv=true;nc++}});
 d.o.forEach(o=>{if(LO[o.status]){o.st0=o.st0||o.status;o.status=LO[o.status];no++}});
 if(nq||no||nc)d.migs={q:nq,o:no,conv:nc,at:new Date().toLocaleDateString('pt-BR')};
 /* v1.5.3: OS com 3 status (Em produção/Finalizado/Entregue). Cancelada = Finalizado + marca "canc". Só converte status antigo, registra a migração UMA vez no histórico e nunca apaga. */
 const LW={'Aguardando início':'Em produção','Em execução':'Em produção','Aguardando material':'Em produção','Aguardando conferência':'Em produção','Pronto para entrega':'Finalizado','Cancelado':'Finalizado'};let nw3=0,nc3=0;
 d.w.forEach(w=>{const old=w.status;if(!LW[old])return;w.st0=w.st0||old;w.status=LW[old];if(old=='Cancelado'){w.canc=true;nc3++}

const vStaff=()=>`<h2>Colaboradores</h2><div class=bar><button class=b onclick=editS()>+ Novo colaborador</button></div>`+(D.s.map(s=>`<div class=card><b>${esc(s.nome)}</b> ${s.ativo?'':'<span class="tag x">Inativo</span>'}<br><span class=mu>${esc(s.esp||'')} ${esc(s.tel||'')}</span><div class=row><button class="b g s" onclick="editS('${s.id}')">Editar</button><button class="b g s" onclick="delS('${s.id}')">Excluir</button></div></div>`).join('')||'<p class=mu>Nenhum colaborador cadastrado.</p>');
/* ===== Início ===== */
function vHome(){const gp=k=>sortG(k,D.w.filter(w=>osGroup(w)==k)),P=gp('pend'),X=gp('prox'),F=gp('fin'),
 prev=(D.o.filter(o=>o.status!='Cancelado').reduce((a,o)=>a+cents(tot(qo(o))),0)+D.q.filter(q=>!q.conv&&q.status!='Recusado'&&!D.o.some(o=>o.q==q.id)).reduce((a,q)=>a+cents(tot(q)),0))/100;
 const card=(l,v,f)=>f?`<div class=stat role=button tabindex=0 onclick="${f}" onkeydown="if(event.key=='Enter')${f}"><b>${v}</b><small>${l}</small></div>`:`<div class=stat><b>${v}</b><small>${l}</small></div>`;
 const list=(arr,f)=>arr.length?arr.slice(0,5).map(w=>wRow(w,1)).join('')+(arr.length>5?`<button class="b g s" onclick="${f}">Ver todas</button>`:''):'<p class=mu>Nenhuma OS.</p>';
 return`<div class=split style="align-items:center"><h2>Início</h2><button class="b s" onclick=newDoc()>+ Novo</button></div>
<div class="grid k4">${card('Faturamento previsto',R$(prev))}${card('Pendentes',P.length,"fOS()")}${card('Entrega próxima',X.length,"fOS()")}${card('Finalizadas',F.length,"fOS({fin:true})")}</div>
<h3 class="gh n">Pendentes (${P.length})</h3>${list(P,'fOS()')}
<h3 class="gh o">Entrega próxima (${X.length})</h3>${list(X,'fOS()')}
<details class=fin><summary class="gh v">Finalizadas (${F.length})</summary>${list(F,'fOS({fin:true})')}</details>`}
/* ===== Configurações ===== */
const theme=t=>{document.documentElement.dataset.theme=t;localStorage.setItem('jesse_theme',t)};
const BK=KEY+'_backup_ultima';
const mkBackup=motivo=>{try{localStorage.setItem(BK,JSON.stringify({at:new Date().toISOString(),motivo,data:D}));return true}catch(e){return false}};
const readBK=()=>{try{const b=JSON.parse(localStorage.getItem(BK)||'null');return b&&b.data&&b.data.c?b:null}catch(e){return null}};
const resetUI=()=>{FL={...FL0};CM={...CM0};UI.f='';UI.fo=false};
const cnt=d=>`${d.c.length} cliente(s), ${d.q.length} orçamento(s), ${d.o.length} pedido(s), ${d.w.length} OS, ${d.s.length} colaborador(es)`;
function askRestore(){ask('Restaurar os dados demonstrativos? Os dados atuais serão substituídos pelos exemplos. Uma cópia de segurança dos dados atuais será guardada antes.',()=>{mkBackup('restauração dos dados demonstrativos');D=seed();resetUI()})}
function askClear(){modal(`<h3>Limpar dados demonstrativos</h3><p>Serão removidos <b>todos</b> os registros deste aparelho:</p><ul class=li><li>${D.c.length} cliente(s)</li><li>${D.q.length} orçamento(s)</li><li>${D.o.length} pedido(s)</li><li>${D.w.length} ordem(ns) de serviço, com o histórico</li><li>${D.s.length} colaborador(es)</li></ul>
<p><b>Atenção:</b> registros criados por você durante os testes também serão apagados. O tema e as preferências são mantidos. Uma cópia de segurança dos dados atuais será guardada antes.</p>
<label for=cf>Para confirmar, digite LIMPAR</label><input id=cf autocomplete=off autocapitalize=characters spellcheck=false><p class=er id=cerr></p>
<div class=row><button class="b g" onclick=closeM()>Cancelar</button><button class="b r" id=go disabled>Limpar dados</button></div>`);
 $('#cf').oninput=e=>{$('#go').disabled=e.target.value.trim().toUpperCase()!='LIMPAR'};
 $('#go').onclick=()=>{if(!mkBackup('limpeza dos dados demonstrativos')){$('#cerr').textContent='Não foi possível criar a cópia de segurança. Nada foi apagado.';return}
  D={c:[],q:[],o:[],s:[],w:[],ver:D.ver};save();resetUI();closeM();toast('Dados removidos. Cópia de segurança guardada.');R()}}
function askUndo(){const b=readBK();if(!b)return;modal(`<h3>Restaurar cópia de segurança</h3><p>Cópia de ${fdt(b.at)} (${esc(b.motivo)}):<br><span class=mu>${cnt(b.data)}</span></p><p>Os dados atuais serão substituídos por esta cópia.</p><div class=row><button class="b g" onclick=closeM()>Cancelar</button><button class=b id=ok2>Restaurar cópia</button></div>`);
 $('#ok2').onclick=()=>{D=b.data;migrate(D);save();resetUI();closeM();toast('Cópia restaurada.');R()}}
const vCfg=()=>{const bk=readBK();return`<h2>Configurações</h2><div class=card><h3>Tema</h3><div class=row style="margin-top:0"><button class="b g" onclick="theme('light');R()">Claro</button><button class="b g" onclick="theme('dark');R()">Escuro</button></div></div>
<div class=card><h3>Empresa</h3><img src="icons/logo.jpg" style="height:48px;border-radius:6px"><p>Jessé Auto Couros e Capotas<br><span class=mu>Serviço em couro para toda linha automotiva.</span></p></div>
<div class=card><h3>Dados</h3><p class=mu>Os dados ficam salvos só neste aparelho/navegador e não sincronizam entre dispositivos.</p>${D.mig?`<p class=mu>Atualização 1.2: ${D.mig.n} pedido(s) receberam cópia independente dos dados do orçamento (${D.mig.at}).</p>`:''}${D.migw?`<p class=mu>Atualização 1.4: ${D.migw.n} OS receberam histórico e ${D.migw.mapped} tiveram o status convertido (Concluída → Pronto para entrega; Pausada → Em execução). Uma cópia dos dados da versão anterior foi guardada automaticamente neste navegador.</p>`:''}${D.migs?`<p class=mu>Atualização 1.5.1: ${D.migs.q} orçamento(s) e ${D.migs.o} pedido(s) tiveram o status antigo convertido e ${D.migs.conv} orçamento(s) já convertidos em pedido foram arquivados (nada foi apagado). Uma cópia dos dados anteriores foi guardada neste navegador.</p>`:''}${D.migo?`<p class=mu>Atualização 1.5.3: ${D.migo.n} OS tiveram o status antigo simplificado (${D.migo.canc} cancelada(s) preservada(s) como “Cancelada”). A migração foi registrada no histórico de cada OS e uma cópia dos dados anteriores foi guardada neste navegador.</p>`:''}${window.__migErr?'<p class=er>A atualização dos dados falhou; os dados originais foram mantidos.</p>':''}${D.pend?.length?`<p class=er>Atenção: o(s) pedido(s) #${D.pend.join(', #')} não puderam ser migrados (orçamento original não encontrado). Os dados foram preservados.</p>`:''}${bk?`<p class=mu>Cópia de segurança de ${fdt(bk.at)} (${esc(bk.motivo)}): ${cnt(bk.data)}.</p><button class="b g s" onclick="askUndo()">Restaurar cópia de segurança</button>`:''}</div>
<div class=card><h3>Restaurar dados demonstrativos</h3><p class=mu>Substitui os dados atuais pelos exemplos do sistema (clientes, orçamentos, pedidos, OS e colaboradores fictícios).</p><button class="b g" onclick="askRestore()">Restaurar dados demonstrativos</button></div>
<div class=card><h3>Limpar dados demonstrativos</h3><p class=mu>Remove todos os registros e deixa o sistema vazio, pronto para uma apresentação ou para dados reais.</p><button class="b r" onclick="askClear()">Limpar dados demonstrativos</button></div>
<div class=card><h3>Sobre</h3><p class=mu>Versão 1.5.3 (demonstração). Preparado para evoluir com banco de dados e login.</p></div>`}

/* ===== Navegação ===== */
const IC={home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',clients:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.3c1.8.8 3 2.6 3 5.7"/>',com:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',os:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 14l2 2 4-4"/>',more:'<circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/>',orders:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',staff:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',cfg:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',filter:'<path d="M3 5h18l-7 8v6l-4 2v-8z"/>'};
const svg=k=>`<svg class=ic viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;
const V_={home:['Início',vHome],clients:['Clientes',vClients],com:['Comercial',vCom],os:['OS',vOS],staff:['Colaboradores',vStaff],cfg:['Configurações',vCfg]};
const NAV1=['home','clients','com','os'],NAV2=['staff','cfg'];let MORE=false;
const navHtml=()=>NAV1.map(k=>`<a href="#${k}" class="${k==cur?'on':''}" ${k==cur?'aria-current="page"':''}>${svg(k)}<span>${V_[k][0]}</span></a>`).join('')
 +`<button type=button id=mb class="${NAV2.includes(cur)||MORE?'on':''}" aria-haspopup="menu" aria-expanded="${MORE}" onclick="toggleMore(event)">${svg('more')}<span>Mais</span></button>`
 +(MORE?`<div class=more role=menu>${NAV2.map(k=>`<a role=menuitem href="#${k}" class="${k==cur?'on':''}" onclick="MORE=false;setTimeout(renderNav,0)">${svg(k)}<span>${V_[k][0]}</span></a>`).join('')}</div>`:'');
const renderNav=()=>{$('#nav').innerHTML=navHtml()},toggleMore=e=>{e.stopPropagation();MORE=!MORE;renderNav()};
let cur='home';
function R(keep){const v=V_[cur]||V_.home;renderNav();
 const f=keep&&document.activeElement?.id=='sq';$('#app').innerHTML=v[1]();if(f){const s=$('#sq');s.focus();s.setSelectionRange(99,99)}}
const ALIAS={quotes:'com',orders:'com'};
function route(){const h=location.hash.slice(1)||'home';if(h=='quotes')CM={...CM0,tipo:'q'};else if(h=='orders')CM={...CM0,tipo:'o'};cur=ALIAS[h]||h}
addEventListener('hashchange',()=>{route();MORE=false;UI.f='';scrollTo(0,0);R()});
document.addEventListener('click',e=>{if(MORE&&!e.target.closest('nav')){MORE=false;renderNav()}});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&MORE){MORE=false;renderNav();$('#mb')?.focus()}});
{const kb=e=>document.body.classList.toggle('kb',e.type=='focusin'&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&!e.target.closest('.md')&&matchMedia('(max-width:799px)').matches);addEventListener('focusin',kb);addEventListener('focusout',kb)}
route();
theme(localStorage.getItem('jesse_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
R();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
